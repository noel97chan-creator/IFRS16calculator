<div id="results-section" class="hidden">
    <div class="card results-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-chart-pie"></i> Calculation Summary</h2>
        </div>
        
        <div class="summary-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px;">
            <div class="summary-item">
                <span class="label">Total Lease Liability</span>
                <div id="summary-liability" class="value">$0.00</div>
            </div>
            <div class="summary-item" style="border-left: 3px solid var(--accent);">
                <span class="label">Right-of-Use (ROU) Asset</span>
                <div id="summary-rou" class="value">$0.00</div>
            </div>
            <div class="summary-item">
                <span class="label">Total Interest</span>
                <div id="summary-interest" class="value" style="color: #e11d48;">$0.00</div>
            </div>
        </div>

        <div class="card-header" style="border-top: 1px solid var(--border);">
            <div style="display:flex; justify-content: space-between; align-items: center; width: 100%;">
                <h2><i class="fa-solid fa-table"></i> Amortization Schedule</h2>
                <button id="downloadBtn" class="btn-excel hidden">
                    <i class="fa-solid fa-file-csv"></i> Export Data
                </button>
            </div>
        </div>
        </div>
</div>
