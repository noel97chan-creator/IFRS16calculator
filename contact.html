<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | IFRS16Pro Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3291734589203338" crossorigin="anonymous"></script>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo-link">
                <div class="logo"><i class="fa-solid fa-calculator"></i> IFRS16<span>Pro</span></div>
            </a>
            <div class="nav-links">
                <a href="index.html">Back to Calculator</a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="content-card">
            <h1>Contact Administration</h1>
            <p>We welcome your questions and feedback.</p>
            <hr>
            <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST" class="contact-form">
                <div class="input-group">
                    <label>Your Email</label>
                    <input type="email" name="_replyto" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px;">
                </div>
                <div class="input-group">
                    <label>Message</label>
                    <textarea name="message" rows="5" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px;"></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Use</a>
            </div>
            <p>&copy; 2024 IFRS16Pro. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
